<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUEZONE GAMES</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#070b16;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#101a30;
 padding:22px;
 text-align:center;
 border-bottom:2px solid #168bff;
}
header h1{
 color:#168bff;
 font-size:30px;
 margin:5px;
}
header p{color:#aabbd5}
nav{
 text-align:center;
 padding:15px;
 color:#168bff;
}
.container{padding:18px}
h2{color:#168bff}
input{
 width:100%;
 padding:14px;
 border:1px solid #168bff;
 border-radius:10px;
 background:#111b30;
 color:white;
 font-size:16px;
 margin-bottom:20px;
}
.games{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:13px;
}
.card{
 background:#111b30;
 border:1px solid #1c4f86;
 border-radius:14px;
 padding:18px 10px;
 text-align:center;
}
.card .emoji{font-size:38px}
.card h3{font-size:17px}
button{
 background:#087cf0;
 color:white;
 border:0;
 padding:12px 17px;
 border-radius:9px;
 font-weight:bold;
 cursor:pointer;
}
button:active{transform:scale(.96)}
#game{
 display:none;
 background:#111b30;
 border:1px solid #168bff;
 border-radius:14px;
 padding:20px;
 margin-top:22px;
 text-align:center;
}
#game button{margin:5px}
#result{color:#55b5ff;font-size:18px}
footer{
 text-align:center;
 color:#8192ae;
 padding:30px;
}
</style>
</head>

<body>

<header>
<h1>🎮 BLUEZONE GAMES</h1>
<p>YOUR WORLD OF GAMES</p>
</header>

<nav>الرئيسية　 |　 الألعاب　 |　 تواصل معنا</nav>

<div class="container">
<h2>🔥 اكتشف الألعاب</h2>

<input id="search" placeholder="ابحث عن لعبة..." oninput="searchGames()">

<div class="games" id="games">

<div class="card" data-name="النقر السريع">
<div class="emoji">⚡</div>
<h3>النقر السريع</h3>
<p>كم نقرة تستطيع تحقيقها؟</p>
<button onclick="startGame('click')">العب الآن</button>
</div>

<div class="card" data-name="تخمين الرقم">
<div class="emoji">🔢</div>
<h3>تخمين الرقم</h3>
<p>اكتشف الرقم السري!</p>
<button onclick="startGame('guess')">العب الآن</button>
</div>

<div class="card" data-name="حجر ورقة مقص">
<div class="emoji">✊</div>
<h3>حجر ورقة مقص</h3>
<p>تحدّ الكمبيوتر!</p>
<button onclick="startGame('rps')">العب الآن</button>
</div>

</div>

<div id="game">
<h2 id="gameTitle"></h2>
<div id="gameContent"></div>
<p id="result"></p>
<button onclick="closeGame()">إغلاق اللعبة</button>
</div>

</div>

<footer>
BLUEZONE GAMES © 2026
<br><br>
Made with 💙
</footer>

<script>
let clicks=0;
let secret=0;

function searchGames(){
 let q=document.getElementById("search").value.toLowerCase();
 document.querySelectorAll(".card").forEach(card=>{
  card.style.display=card.dataset.name.toLowerCase().includes(q)?"block":"none";
 });
}

function startGame(type){
 document.getElementById("game").style.display="block";
 document.getElementById("result").innerText="";
 let content=document.getElementById("gameContent");

 if(type==="click"){
  clicks=0;
  document.getElementById("gameTitle").innerText="⚡ النقر السريع";
  content.innerHTML='<h2 id="count">0</h2><button onclick="clickMe()">اضغط هنا!</button>';
 }
 else if(type==="guess"){
  secret=Math.floor(Math.random()*10)+1;
  document.getElementById("gameTitle").innerText="🔢 تخمين الرقم";
  content.innerHTML='<p>اختر رقماً من 1 إلى 10</p><input id="guessInput" type="number" min="1" max="10"><button onclick="checkGuess()">تحقق</button>';
 }
 else{
  document.getElementById("gameTitle").innerText="✊ حجر ورقة مقص";
  content.innerHTML='<button onclick="playRPS(0)">✊ حجر</button><button onclick="playRPS(1)">📄 ورقة</button><button onclick="playRPS(2)">✂️ مقص</button>';
 }
 document.getElementById("game").scrollIntoView({behavior:"smooth"});
}

function clickMe(){
 clicks++;
 document.getElementById("count").innerText=clicks;
 document.getElementById("result").innerText="رائع! عدد نقراتك: "+clicks;
}

function checkGuess(){
 let n=Number(document.getElementById("guessInput").value);
 let r=document.getElementById("result");
 if(n===secret) r.innerText="🎉 أحسنت! الرقم صحيح!";
 else if(n<secret) r.innerText="⬆️ جرّب رقماً أكبر";
 else r.innerText="⬇️ جرّب رقماً أصغر";
}

function playRPS(user){
 let choices=["حجر","ورقة","مقص"];
 let computer=Math.floor(Math.random()*3);
 let result;
 if(user===computer) result="تعادل!";
 else if((user-computer+3)%3===1) result="🎉 فزت!";
 else result="😎 الكمبيوتر فاز!";
 document.getElementById("result").innerText=
 "أنت: "+choices[user]+" | الكمبيوتر: "+choices[computer]+" — "+result;
}

function closeGame(){
 document.getElementById("game").style.display="none";
}
</script>

</body>
</html>
